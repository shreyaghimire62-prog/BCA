<!DOCTYPE html>
<html>
<head>
    <title>Table with Images</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Student Information</h2>

    <table>
        <tr>
            <th rowspan="2">Photo</th>
            <th colspan="2">Student Details</th>
            <th rowspan="2">Course</th>
        </tr>

        <tr>
            <th>Name</th>
            <th>Age</th>
        </tr>

        <tr>
            <td><img src="student1.jpg" alt="Student 1"></td>
            <td>Shreya</td>
            <td>20</td>
            <td>BCA</td>
        </tr>

        <tr>
            <td><img src="student2.jpg" alt="Student 2"></td>
            <td>Prenka</td>
            <td>20</td>
            <td>CSIT</td>
        </tr>

        <tr>
            <td colspan="4">Total Students: 2</td>
        </tr>
    </table>

</body>
</html>
