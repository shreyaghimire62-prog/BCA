<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3x3 Table Example</title>
</head>
<body>

    <h2>Student Grade Sheet</h2>

    <!-- Table Start -->
    <table border="1" cellpadding="10" cellspacing="0">
        
        <caption><b>Student Grade Sheet</b></caption>

        <!-- Table Header -->
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Grade</th>
        </tr>

        <!-- Row 1 -->
        <tr>
            <td>1</td>
            <td>Shreya</td>
            <td>A+</td>
        </tr>

        <!-- Row 2 -->
        <tr>
            <td>2</td>
            <td>Binita</td>
            <td>A</td>
        </tr>

    </table>
    <!-- Table End -->

</body>
</html>
