<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mogu Mogu Lychee</title>
    <!-- Importamos una fuente similar a la del anuncio -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="ad-container">
        <!-- Elementos decorativos de fondo -->
        <div class="decoration fruit-1">🍓</div>
        <div class="decoration fruit-2">🍓</div>
        <div class="decoration character">⬜</div>

        <!-- Columna Izquierda: Información -->
        <section class="content">
            <header>
                <h1 class="brand-logo">MOGU MOGU</h1>
                <p class="tagline">YOU GOTTA CHEW!</p>
            </header>
            
            <div class="product-info">
                <h2 class="flavor">LYCHEE</h2>
                <h3 class="subtitle">WITH NATA DE COCO</h3>

                <div class="specs">
                    <span class="size-item">🍼 320ml</span>
                    <span class="size-item">🍼 1000ml</span>
                </div>

                <p class="description">
                    Mogu Mogu Lychee is a top-selling flavor delivering the perfect blend 
                    of sweet and sour lychee with a unique aroma and extra juiciness.
                </p>

                <!-- Miniaturas de otros sabores -->
                <div class="flavor-variants">
                    <div class="thumb pink"></div>
                    <div class="thumb orange"></div>
                    <div class="thumb purple"></div>
                    <div class="thumb yellow"></div>
                </div>
            </div>
        </section>

        <!-- Columna Derecha: Imagen Principal -->
        <section class="hero-visual">
            <div class="splash-bg"></div>
            <!-- Reemplaza 'bottle.png' con tu imagen real -->
            <img src="https://path-to-your-image.png" alt="Mogu Mogu Lychee Bottle" class="main-bottle">
        </section>
    </div>

</body>
</html>
